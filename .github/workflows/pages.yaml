---
name: 'Pages'

on:
  push:
    branches: ['master']
  workflow_dispatch: {}

permissions:
  contents: 'read'

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7.0.1'
      - uses: 'pnpm/setup@v3.1.2'
        with:
          cache: true

      # The demo phone's screens are in LFS, which the checkout leaves as pointers. Only what the site publishes is
      # pulled, rather than every capture the tests read, and `assemble` fails the build over a pointer this missed.
      - run: 'git lfs pull --include="$(node scripts/published.mts)"'
      - run: 'pnpm build'

      - uses: 'actions/upload-pages-artifact@v5.0.0'
        with:
          path: 'dist'

  deploy:
    name: 'Deploy'
    needs: 'build'
    runs-on: 'ubuntu-latest'

    permissions:
      id-token: 'write'
      pages: 'write'

    environment:
      name: 'github-pages'
      url: '${{ steps.deploy.outputs.page_url }}'

    steps:
      - id: 'deploy'
        uses: 'actions/deploy-pages@v5.0.1'
