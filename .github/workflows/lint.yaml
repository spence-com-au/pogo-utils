---
name: 'Lint'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

jobs:
  all:
    name: 'Lint'
    needs: 'lint'
    if: 'always()'
    runs-on: 'ubuntu-latest'
    steps:
      - if: "needs.lint.result != 'success'"
        run: 'exit 1'

  lint:
    name: '${{ matrix.check }}'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        check:
          - 'css'
          - 'html'
          - 'js'
          - 'prettier'
          - 'types'
          - 'xml'
    steps:
      - uses: 'actions/checkout@v7.0.1'
      - uses: 'pnpm/setup@v3.1.2'
        with:
          cache: true

      # `lint:types` is `pnpm build`, which publishes the demo phone's screens out of LFS, as `pages.yaml` does.
      - if: "matrix.check == 'types'"
        run: 'git lfs pull --include="$(node scripts/published.mts)"'
      - run: 'pnpm lint:${{ matrix.check }}'
