---
name: 'Test'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

jobs:
  all:
    name: 'Unit Test'
    needs: 'test'
    if: 'always()'
    runs-on: 'ubuntu-latest'
    steps:
      - if: "needs.test.result != 'success'"
        run: 'exit 1'

  test:
    name: '${{ matrix.project }}'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - 'corpus'
          - 'default'
    steps:
      - uses: 'actions/checkout@v7.0.1'
        with:
          lfs: true

      # Restored from the Actions cache, so a slow Ubuntu mirror only costs the run that misses it.
      - uses: 'awalsh128/cache-apt-pkgs-action@v1.6.3'
        with:
          packages: 'ffmpeg tesseract-ocr tesseract-ocr-eng'

          # `libblas3` and `liblapack3` link the `libblas.so.3` and `liblapack.so.3` that `ffmpeg` loads only in their
          # `postinst`, through `update-alternatives`.
          execute_install_scripts: true

      - uses: 'pnpm/setup@v3.1.2'
        with:
          cache: true
      - run: 'pnpm test:${{ matrix.project }}'
