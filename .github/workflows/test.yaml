---
name: 'Test'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

jobs:
  all:
    name: 'Unit Test'
    needs: 'test'
    if: 'always()'
    runs-on: 'ubuntu-latest'
    steps:
      - if: "needs.test.result != 'success'"
        run: 'exit 1'

  test:
    name: '${{ matrix.name }}'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    env:
      INVENTORY_OCR: '${{ matrix.ocr }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The suite in three, each runner taking a third of the files, since a few of them read for minutes apiece.
          - name: 'Tesseract CLI (1/3)'
            test: 'test --shard=1/3'
          - name: 'Tesseract CLI (2/3)'
            test: 'test --shard=2/3'
          - name: 'Tesseract CLI (3/3)'
            test: 'test --shard=3/3'

          # The pages read with tesseract.js, not the CLI's Tesseract, so the tests whose engine `INVENTORY_OCR` picks
          # are read with it too. Those are the ones importing `test-engine.mts`, the one module that reads it; every
          # other test reads the same under either and is left to the legs above.
          - name: 'tesseract.js'
            ocr: 'wasm'
            test: 'exec vitest related --run src/core/node/test-engine.mts'
    steps:
      - uses: 'actions/checkout@v7.0.1'
        with:
          lfs: true

      # Restored from the Actions cache, so a slow Ubuntu mirror only costs the run that misses it.
      - uses: 'awalsh128/cache-apt-pkgs-action@v1.6.3'
        with:
          packages: 'ffmpeg tesseract-ocr tesseract-ocr-eng'

          # `libblas3` and `liblapack3` link the `libblas.so.3` and `liblapack.so.3` that `ffmpeg` loads only in their
          # `postinst`, through `update-alternatives`.
          execute_install_scripts: true

      - uses: 'pnpm/setup@v3.2.0'
        with:
          cache: true
      - run: 'pnpm ${{ matrix.test }}'
